<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 | Bad Request</title>
    <style>
        body {
            margin: 0;
            padding: 1.5rem;
            background-color: #ffffff;
            color: #111111;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            text-align: left;
            width: 100%;
            max-width: 600px;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 500;
            margin: 0 0 0.5rem 0;
        }
        p {
            color: #666666;
            font-size: 0.875rem;
            margin: 0;
            line-height: 1.6;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>400 | Bad Request</h1>
        <p>
            Sorry! The request could not be understood by this server due to invalid syntax.<br>
            ごめんなさい！リクエストの構文が正しくないため、サーバーで処理できませんでした。
        </p>
    </div>
</body>
</html>
